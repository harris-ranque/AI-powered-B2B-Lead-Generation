# Railway Frontend Configuration
[phases.setup]
nixPkgs = ["nodejs-18_x"]

[phases.install]
cmds = [
  "corepack enable",
  "npm install -g pnpm",
  "pnpm install"
]

[phases.build]
cmds = [
  "node prebuild.cjs",
  "node convex-mock.cjs",
  "pnpm build"
]

[start]
cmd = "pnpm start"

[variables]
# Set placeholder Convex URL for build
VITE_CONVEX_URL = "https://placeholder.convex.cloud"