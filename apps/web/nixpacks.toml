# Railway Frontend Configuration
[phases.setup]
nixPkgs = ["nodejs-18_x"]

[phases.install]
cmds = [
  "npm install"
]

[phases.build]
cmds = [
  "node prebuild.cjs",
  "node convex-mock.cjs",
  "npm run build"
]

[start]
cmd = "npm start"

[variables]
# Set placeholder Convex URL for build
VITE_CONVEX_URL = "https://placeholder.convex.cloud"