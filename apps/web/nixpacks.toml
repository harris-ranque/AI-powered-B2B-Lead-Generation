# Railway Frontend Configuration
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs-18_x", "npm-9_x"]

[phases.install]
dependsOn = ["setup"]
# Install dependencies
cmds = [
  "npm install --legacy-peer-deps"
]

[phases.build]
dependsOn = ["install"]
# Generate mock Convex files and build
cmds = [
  "node convex-mock.js",
  "npm run build"
]

[start]
cmd = "npm start"

[variables]
# Set placeholder Convex URL for build
VITE_CONVEX_URL = "https://placeholder.convex.cloud"