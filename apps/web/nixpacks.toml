# Railway Frontend Configuration
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs-18_x", "npm-9_x"]

[phases.install]
dependsOn = ["setup"]
# No need to cd - Railway builds from service directory
cmds = [
  "npm install --legacy-peer-deps"
]

[phases.build]
dependsOn = ["install"]
cmds = [
  "npm run build"
]

[start]
cmd = "npm start"