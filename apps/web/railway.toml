# Railway Frontend Configuration - Build from monorepo root
[build]
builder = "DOCKERFILE"
# Build from monorepo root to access convex-backend for codegen
context = "../.."
dockerfile = "apps/web/Dockerfile.railway"

[deploy]
startCommand = "nginx -g 'daemon off;'"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3