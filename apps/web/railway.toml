# Railway Frontend Configuration
[build]
builder = "NIXPACKS"
buildCommand = "cd ../.. && pnpm install --frozen-lockfile && cd apps/web && pnpm build"
watchPaths = [
  "apps/web/**",
  "packages/**",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml"
]

[deploy]
startCommand = "pnpm start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "always"

[service]
internalPort = 3000