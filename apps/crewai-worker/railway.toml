# Railway CrewAI Worker Configuration
[build]
builder = "nixpacks"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "always"
numReplicas = 1

[service]
internalPort = 8080

[variables]
PYTHONUNBUFFERED = "1"
ENVIRONMENT = "production"