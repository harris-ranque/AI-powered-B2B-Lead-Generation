# Railway CrewAI Worker Configuration
[build]
builder = "NIXPACKS"

[deploy]
# Use hypercorn as recommended by Railway for FastAPI
startCommand = "hypercorn app.main:app --bind \"[::]:$PORT\""
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "always"
numReplicas = 1

[service]
internalPort = 8080