# Railway CrewAI Worker Configuration
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.minimal"

[deploy]
startCommand = "./start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "always"

[variables]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
PORT = "8080"