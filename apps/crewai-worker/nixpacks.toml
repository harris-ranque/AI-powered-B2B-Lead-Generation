providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "cd apps/crewai-worker && pip install --upgrade pip",
  "cd apps/crewai-worker && pip install -r requirements.txt"
]

[start]
cmd = "cd apps/crewai-worker && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"