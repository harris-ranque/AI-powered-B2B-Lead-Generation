# Railway Python FastAPI Configuration
providers = ["python"]

[phases.setup]
# Ensure Python 3.11 and build dependencies are installed
nixPkgs = ["python311", "python311Packages.pip", "gcc", "stdenv.cc"]

[phases.install]
dependsOn = ["setup"]
# No need to cd - Railway builds from service directory
cmds = [
  "python -m pip install --upgrade pip",
  "pip install -r requirements.txt"
]

[phases.build]
dependsOn = ["install"]
# No build phase needed for Python

[start]
# Use hypercorn as recommended by Railway for FastAPI
cmd = "python -m hypercorn app.main:app --bind \"[::]:$PORT\""

[variables]
# Ensure Python is unbuffered for real-time logs
PYTHONUNBUFFERED = "1"
NIXPACKS_PYTHON_VERSION = "3.11"